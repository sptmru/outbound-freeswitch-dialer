name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outbound_dialer_test
          POSTGRES_USER: outbound_dialer
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outbound_dialer -d outbound_dialer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://outbound_dialer:integration-test-password@127.0.0.1:5432/outbound_dialer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate Compose model
        run: |
          cp .env.example .env
          chmod 600 .env
          APP_ENV_FILE="$PWD/.env" docker compose --env-file .env -f infra/docker/docker-compose.yml config --quiet

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy-client:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLIENT_DEPLOY_ENABLED == 'true'
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: client-production
    concurrency:
      group: client-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.CLIENT_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.CLIENT_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.CLIENT_DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CLIENT_DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.CLIENT_DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure deployment SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/client-deploy"
          chmod 600 "${HOME}/.ssh/client-deploy"
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy exact commit to client production
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i "${HOME}/.ssh/client-deploy" \
            -p "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/opt/outbound-dialer/scripts/deploy-commit.sh '${TARGET_SHA}'"
