groups:
  - name: outbound-dialer-availability
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: ExternalHttpProbeFailed
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "External HTTP check failed"
          description: "{{ $labels.instance }} has failed its HTTP readiness check for more than 2 minutes."

      - alert: TlsCertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 14 * 24 * 60 * 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires soon"
          description: "{{ $labels.instance }} certificate expires in less than 14 days."

      - alert: ApplicationMetricsDatabaseQueryFailed
        expr: outbound_dialer_database_metrics_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application monitoring cannot query PostgreSQL"
          description: "The API metrics snapshot query has failed for more than 2 minutes."

      - alert: ApplicationMetricsSnapshotStale
        expr: absent(outbound_dialer_metrics_snapshot_last_refresh_timestamp_seconds) or (time() - outbound_dialer_metrics_snapshot_last_refresh_timestamp_seconds > 120)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Application metrics snapshot is stale"
          description: "No complete API metrics snapshot has succeeded for more than 2 minutes."

      - alert: ApplicationDatabasePoolWaiters
        expr: outbound_dialer_database_pool_waiting_requests > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Application database pool is saturated"
          description: "API work has been waiting for a PostgreSQL connection for more than 2 minutes."

      - alert: BackupMissing
        expr: absent(outbound_dialer_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No successful backup has been recorded"
          description: "Run scripts/backup.sh and verify the node-exporter textfile collector mount."

      - alert: BackupStale
        expr: time() - outbound_dialer_backup_last_success_timestamp_seconds > 26 * 60 * 60
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The latest backup is stale"
          description: "No successful encrypted backup has completed during the last 26 hours."

      - alert: RetentionRunFailing
        expr: increase(outbound_dialer_retention_failures_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Automatic retention failed"
          description: "At least one call/recording retention run failed during the last 30 minutes; metadata is preserved for retry."

      - alert: RetentionRunMissing
        expr: outbound_dialer_retention_enabled == 1 and absent(outbound_dialer_retention_last_success_timestamp_seconds)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "No successful retention run has been recorded"
          description: "Retention is enabled but the API has not recorded a successful run."

      - alert: RetentionRunStale
        expr: outbound_dialer_retention_enabled == 1 and time() - outbound_dialer_retention_last_success_timestamp_seconds > 30 * 60 * 60
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The latest retention run is stale"
          description: "No successful retention run has completed during the last 30 hours."

      - alert: ApiHighServerErrorRate
        expr: sum(rate(outbound_dialer_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(outbound_dialer_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API server error rate is high"
          description: "More than 5% of API requests have returned 5xx for 5 minutes."

  - name: outbound-dialer-telephony
    rules:
      - alert: FreeSwitchEslListenerDisconnected
        expr: outbound_dialer_esl_listener_enabled == 1 and outbound_dialer_esl_listener_connected == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "FreeSWITCH ESL listener is disconnected"
          description: "The long-lived ESL event listener has not been subscribed for more than 2 minutes."

      - alert: SipTrunkUnavailable
        expr: outbound_dialer_sip_trunk_configured == 1 and outbound_dialer_sip_trunk_ready == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "SIP trunk is unavailable"
          description: "The configured {{ $labels.mode }} SIP trunk has not been ready for more than 3 minutes."

      - alert: StuckOutboundCalls
        expr: outbound_dialer_stuck_calls > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbound calls are stuck"
          description: "{{ $value }} call(s) exceeded the configured active-call threshold."

      - alert: HighOutboundCallFailureRate
        expr: outbound_dialer_calls_attempted_window >= 5 and outbound_dialer_calls_failed_window / outbound_dialer_calls_attempted_window > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbound call failure rate is high"
          description: "More than half of at least five calls in the last 15 minutes failed."

      - alert: CallRecordingFailures
        expr: outbound_dialer_recording_failures_window > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Call recordings are failing"
          description: "{{ $value }} call recording failure(s) were recorded during the last 24 hours."

      - alert: FreeSwitchEventPersistenceErrors
        expr: increase(outbound_dialer_esl_event_errors_total[10m]) > 0 or increase(outbound_dialer_esl_persistence_retries_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "FreeSWITCH events failed to persist"
          description: "At least one ESL event failed or required a transient persistence retry in the last 10 minutes."

      - alert: FreeSwitchEventPersistenceBacklog
        expr: outbound_dialer_esl_persistence_queue_depth > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "FreeSWITCH event persistence queue is not draining"
          description: "{{ $value }} ESL event(s) have remained queued for more than 2 minutes."

      - alert: FreeSwitchEventPersistenceOverflow
        expr: increase(outbound_dialer_esl_persistence_overflows_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "FreeSWITCH event persistence queue overflowed"
          description: "The listener disconnected after its bounded persistence queue filled; active-call reconciliation will run after recovery."

      - alert: RegistrationReconciliationFailing
        expr: outbound_dialer_registration_reconciliation_up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Agent registration reconciliation is failing"
          description: "The 5-second PostgreSQL/FreeSWITCH registration reconciliation has failed continuously for more than 1 minute."

      - alert: RegistrationReconciliationStale
        expr: time() - outbound_dialer_registration_reconciliation_last_run_timestamp_seconds > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Agent registration reconciliation is stale"
          description: "No successful PostgreSQL/FreeSWITCH registration reconciliation has been observed for more than 30 seconds."

      - alert: ActiveCallReconciliationFailing
        expr: outbound_dialer_active_call_reconciliation_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Active-call reconciliation is failing"
          description: "The latest active-call reconciliation attempts have not completed successfully for more than 5 minutes."

      - alert: ActiveCallReconciliationStale
        expr: time() - outbound_dialer_active_call_reconciliation_last_run_timestamp_seconds > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Active-call reconciliation is stale"
          description: "No active-call reconciliation snapshot has been observed for more than 3 minutes."

      - alert: MediaStatsCoverageLow
        expr: sum(outbound_dialer_media_quality_calls_window{coverage="eligible"}) >= 10 and sum(outbound_dialer_media_quality_calls_window{coverage="complete"}) / clamp_min(sum(outbound_dialer_media_quality_calls_window{coverage="eligible"}), 1) < 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Completed-call media statistics coverage is low"
          description: "Fewer than 80% of at least 10 eligible answered calls have media statistics for both legs."

      - alert: TerminalFinalizationSlow
        expr: outbound_dialer_terminal_finalization_duration_milliseconds{statistic="p95"} > 5000 and on() outbound_dialer_terminal_finalization_samples_window >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Terminal call persistence is slow"
          description: "Customer terminal-event persistence p95 exceeded 5 seconds across at least 10 measured calls for 10 minutes."

  - name: outbound-dialer-host
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage is high"
          description: "CPU usage has been above 85% for 10 minutes."

      - alert: HostMemoryPressure
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage is high"
          description: "Memory usage has been above 90% for 10 minutes."

      - alert: HostLowDisk
        expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host disk space is low"
          description: "{{ $labels.mountpoint }} has less than 15% free space."

      - alert: HostLowInodes
        expr: 100 * node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs"} < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host inode space is low"
          description: "{{ $labels.mountpoint }} has less than 15% free inodes."

      - alert: ContainerRestartLoop
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "Container is restarting repeatedly"
          description: "{{ $labels.name }} restarted more than twice during the last 15 minutes."

  - name: inbound-ingress
    rules:
      - record: outbound_dialer:ingress_journal_fresh
        expr: (outbound_dialer_ingress_journal_up == bool 1) * ((time() - outbound_dialer_ingress_journal_last_success_timestamp_seconds) < bool 20)
      - alert: IngressJournalUnavailable
        expr: outbound_dialer_ingress_configured == 1 and outbound_dialer:ingress_journal_fresh == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: Independent ingress journal status is unavailable
          description: Check the agent, its private socket and shared volume. Preserve SQLite evidence before recovery.
      - alert: IngressJournalFull
        expr: outbound_dialer_ingress_configured == 1 and outbound_dialer:ingress_journal_fresh == 1 and outbound_dialer_ingress_journal_capacity > 0 and outbound_dialer_ingress_journal_used >= outbound_dialer_ingress_journal_capacity
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: Ingress journal is full; new uncaptured attempts are refused
          description: Inspect pending receipts and import health. Preserve all live and unacknowledged evidence.
      - alert: IngressCaptureFailures
        expr: outbound_dialer_ingress_configured == 1 and outbound_dialer:ingress_journal_fresh == 1 and ((outbound_dialer_ingress_capture_last_failure_timestamp_seconds > 0 and time() - outbound_dialer_ingress_capture_last_failure_timestamp_seconds < 300) or increase(outbound_dialer_ingress_capture_failures[5m]) > 0)
        labels:
          severity: warning
        annotations:
          summary: Ingress journal refused a request
          description: Check journal capacity, filesystem access and switch reachability. Captures rejected before commit may be absent from call history.
      - alert: IngressImportFailures
        expr: outbound_dialer_ingress_configured == 1 and increase(outbound_dialer_ingress_import_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Ingress recovery cannot import or acknowledge retained evidence
          description: Check the API persistence and switch reconciliation paths. Keep the journal available for replay.
      - alert: IngressImportStale
        expr: outbound_dialer_ingress_configured == 1 and time() - outbound_dialer_ingress_import_last_success_timestamp_seconds > 30
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Ingress import has stopped completing
          description: Check the importer, PostgreSQL and ESL even when the independent journal status responds.
      - alert: IngressImportLag
        expr: outbound_dialer_ingress_configured == 1 and outbound_dialer:ingress_journal_fresh == 1 and outbound_dialer_ingress_journal_pending > 0 and time() - outbound_dialer_ingress_oldest_pending_timestamp_seconds > 10
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: Unacknowledged ingress evidence is waiting for import
          description: Check the age of pending updates and compare exact SQL and SQLite sequence acknowledgments.

  - name: outbound-dialer-inbound-operations
    rules:
      - record: outbound_dialer:inbound_database_fresh
        expr: (outbound_dialer_inbound_database_last_success_timestamp_seconds > bool 0) * ((time() - outbound_dialer_inbound_database_last_success_timestamp_seconds) <= bool outbound_dialer_inbound_database_freshness_budget_seconds)
      - alert: InboundMetricsDatabaseStale
        expr: outbound_dialer:inbound_database_fresh == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Inbound SQL monitoring data is stale
          description: Check application pool waiters and PostgreSQL availability. Treat cached queue, work and configuration readings as stale.
      - alert: InboundCallUncertaintyStuck
        expr: outbound_dialer:inbound_database_fresh == 1 and ((outbound_dialer_call_uncertainty_oldest_deadline_timestamp_seconds > 0 and time() - outbound_dialer_call_uncertainty_oldest_deadline_timestamp_seconds > 60) or (outbound_dialer_call_uncertain_slot_oldest_timestamp_seconds > 0 and time() - outbound_dialer_call_uncertain_slot_oldest_timestamp_seconds > 60))
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Call work remains unresolved past its expected recovery interval
          description: Match the call, operation, fixed job, channel and reservation evidence before cleanup. Keep uncertain capacity occupied.
      - alert: InboundConfigurationApplyFailed
        expr: outbound_dialer_inbound_configuration_state{state="failed"} == 1 and on(job, instance) (outbound_dialer_inbound_configuration_enabled == 1 and outbound_dialer:inbound_database_fresh == 1)
        labels:
          severity: critical
        annotations:
          summary: FreeSWITCH inbound configuration apply failed
          description: Compare desired and applied revisions and inspect the restricted apply diagnostic and loaded XML.
      - alert: InboundConfigurationVerificationStale
        expr: outbound_dialer_inbound_configuration_enabled == 1 and outbound_dialer:inbound_database_fresh == 1 and time() - outbound_dialer_inbound_configuration_last_verified_timestamp_seconds > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: No recent verification of the FreeSWITCH inbound configuration
          description: Verify the publisher, ESL and loaded XML. Saved configuration does not prove an applied route.
      - alert: CallExecutorPressure
        expr: sum without (reason) (increase(outbound_dialer_executor_pressure_total[5m])) > 0 or outbound_dialer_executor_local{state="waiters"} > 0 or ((outbound_dialer_executor_pending_operations{priority="normal"} >= 48 or outbound_dialer_executor_pending_operations{priority="critical"} >= 16) and on(job, instance) outbound_dialer:inbound_database_fresh == 1)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Call executor seats, pool or durable backlog are under pressure
          description: Check seat deferrals, acquisition failures and oldest unresolved work. Preserve the critical seats and investigate slow senders.
